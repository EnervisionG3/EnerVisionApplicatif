# Configuration Docker Compose de base : services applicatifs d'EnerVision.
#
# `docker compose up -d` (sans -f additionnel) utilise CE fichier seul :
# ni Keycloak local, ni Traefik local, aucun raccourci de développement
# (bind mount du code, --reload). Les services se connectent à
# l'infrastructure désignée par .env (Keycloak distant par défaut).
#
# Ce fichier n'est PAS le pipeline de déploiement CI/CD : le déploiement
# réel (voir deploy.sh) cible docker-compose-prod.yaml, géré séparément,
# par service, avec des images GHCR. Celui-ci est la configuration à
# utiliser depuis un poste développeur, avec des valeurs par défaut sûres.
#
# Mode local (Keycloak + Traefik locaux, hot-reload) : voir README ou
# `.\docker.ps1 local up`.
services:
  backend:
    build:
      context: .
      dockerfile: backend/core/Dockerfile
    networks:
      - enervision_network
    ports:
      - "8000:8000"
    env_file:
      - .env
    secrets:
      - db_password
      - keycloak_client_secret

  frontend:
    build:
      context: ./frontend
    networks:
      - enervision_network
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: ${BACKEND_URL}
    volumes:
      - ./frontend/.streamlit/secrets.toml:/frontend/.streamlit/secrets.toml:ro

  worker-ingestion:
    build:
      context: .
      dockerfile: backend/workeringestion/Dockerfile
    networks:
      - enervision_network
    environment:
      MOCK_API_URL: ${MOCK_API_URL}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_SAS_INGESTION: ${AZURE_SAS_INGESTION}

  health:
    build:
      context: .
      dockerfile: backend/health/Dockerfile
    networks:
      - enervision_network
    ports:
      - "8002:8000"

secrets:
  db_password:
    file: ./secrets/db_password

  keycloak_client_secret:
    file: ./secrets/keycloak_client_secret

networks:
  enervision_network:
    external: true
